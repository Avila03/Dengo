name: Testes do banco (SQL)
on:
  push:
    branches: [main]
    paths: ["supabase/**", "tests/*.sql", "scripts/test-sql.sh", ".github/workflows/sql.yml"]
  pull_request:
    paths: ["supabase/**", "tests/*.sql", "scripts/test-sql.sh", ".github/workflows/sql.yml"]
  workflow_dispatch:
jobs:
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: scripts/test-sql.sh
